<nav class="navbar">
  <div class="nav-brand">
    <a routerLink="/" class="brand-link">
      🚗 <span>CarRental</span>
    </a>
  </div>

  <div class="nav-actions">
    <ng-container *ngIf="isLoggedIn; else guestLinks">
      <a *ngIf="hasRole('USER')" routerLink="/user-dashboard" class="nav-btn">User Portal</a>
      <a *ngIf="hasRole('HOST')" routerLink="/host-dashboard" class="nav-btn">Host Portal</a>
      <a *ngIf="hasRole('USER') && !hasRole('HOST')" routerLink="/host-onboarding" class="nav-btn nav-btn-primary">Become a Host</a>
      <span class="role-badge">{{ roles.join(' • ') }}</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </ng-container>

    <ng-template #guestLinks>
      <a routerLink="/login" class="nav-btn">Login</a>
      <a routerLink="/register" class="nav-btn">Register</a>
      <a routerLink="/register" [queryParams]="{ mode: 'host' }" class="nav-btn nav-btn-primary">Register as Host</a>
    </ng-template>
  </div>
</nav>
